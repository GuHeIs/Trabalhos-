<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Catálogo Interativo</h1>
        <p>Cadastre novos produtos utilizando JavaScript e DOM.</p>
    </header>
    <main>
        <section class="formulario">
            <h2>Cadastrar produto</h2>
            <label for="nome">Nome do produto:</label>
            <input 
                type="text" 
                id="nome" 
                placeholder="Digite o nome do produto"
            >
            <label for="categoria">Categoria:</label>
            <input 
                type="text" 
                id="categoria" 
                placeholder="Digite a categoria"
            >
            <label for="preco">Preço:</label>
            <input 
                type="number" 
                id="preco" 
                placeholder="Digite o preço"
                step="0.01"
            >
            <label for="desc">Descrição:</label>
            <input 
                type="text" 
                id="desc" 
                placeholder="Digite a descrição do produto"
                >
            <div class="botoes">
                <button type="button" id="visualizar">
                    Visualizar
                </button>
                <button type="button" id="adicionar">
                    Adicionar ao catálogo
                </button>
            </div>
            <p id="mensagemErro"></p>
        </section>
        <section class="previa">
            <h2>Pré-visualização</h2>
            <div class="card">
                <h3 id="visualNome">
                    Nome do produto
                </h3>
                <p id="visualCategoria">
                    Categoria
                </p>
                <p id="visualPreco">
                    R$ 0,00
                </p>
                <p id="visualDesc">
                    Descrição do produto
                </p>
            </div>
            <h2>Produtos cadastrados</h2>
            <div id="listaItens"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 - Catálogo Interativo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
