<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Mural de Recados</h1>
    <div class="container">
        <div class="caixa">
            <h2>Seu recado</h2>
            <br>
            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome" placeholder="Digite seu nome aqui">
            <br>
            <label for="assunto">Assunto do recado:</label>
            <br>
            <input type="text" id="assunto" placeholder="Digite o assunto">
            <br>
            <label for="mensagem">Sua mensagem:</label>
            <br>
            <input type="text" id="mensagem" placeholder="Digite sua mensagem">
            <br>
            <br>
            <button id="envio">
                <p>Enviar?</p>
            </button>
            <button id="visu">
                <P>Ver Pré-visualização</P>
            </button>
        </div>
        <br>
        <br>
        <div class="caixa">
            <h2>Pré-visualização</h2>
            <strong id="Assunto">Assunto</strong>
            <p id="Mensagem">Sua mensagem</p>
            <p id="Nome">Autor</p>
        </div>
        <br><br>
        <div class="recados">
            <h2>Recados criados</h2>
            <br><br>
        </div>
        <script src="script.js"></script>
    </div>
</body>

</html>
